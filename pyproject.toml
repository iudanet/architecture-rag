[project]
name = "architecture-rag"
version = "0.1.0"
description = "RAG-бот по корпоративной базе знаний (учебный проект 7 спринта)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "qdrant-client>=1.19",
    "langchain-text-splitters>=1.1",
    "openai>=3.13",
    "fastapi>=0.141",
    "uvicorn[standard]>=0.34",
    "pydantic-settings>=2.15",
    "httpx>=0.28",
    "jinja2>=3.1.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    "ty>=0.0.80",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# В тестах фейковые классы имитируют ответ клиента — это заглушки,
# а не модели данных, требование ClassVar здесь неуместно
"tests/*" = ["RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag"]

[tool.ty.environment]
python-version = "3.12"
